      <stop offset="0" stop-color="#0f2a22"/>
      <stop offset="1" stop-color="#07130f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1fbf80"/>
