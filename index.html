<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130f">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<!--SEO_HEAD-->
<link rel="stylesheet" href="styles.css">

<body>
<div id="announce" class="announce" hidden></div>
<header class="topbar" id="topbar">

</header>
<div class="shell">
  <aside class="side" id="side" aria-label="Sections"></aside>

    <div class="seo-fallback"><!--SEO_BODY--></div>
  </main>
  <aside class="rail" id="rail" aria-label="Suggestions"></aside>
</div>
<nav class="tabbar" id="tabbar" aria-label="Mobile"></nav>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="/socket.io/socket.io.js" defer></script>
<script src="core.js" defer></script>
<script src="components.js" defer></script>
<script src="auth.js" defer></script>

<script src="creator.js" defer></script>
<script src="dropship.js" defer></script>
<script src="app.js" defer></script>

</html>
